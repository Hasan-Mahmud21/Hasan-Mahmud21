<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color"
                 values="#0f172a;#020617;#111827;#0f172a"
                 dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color"
                 values="#1e293b;#0f172a;#020617;#1e293b"
                 dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color"
                 values="#020617;#111827;#0f172a;#020617"
                 dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <style>
    .card {
      fill: rgba(15,23,42,0.7);
      stroke: url(#borderGrad);
      stroke-width: 2;
      rx: 28;
      ry: 28;
      filter: drop-shadow(0 0 16px rgba(56,189,248,0.25));
    }
    .hello {
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 26px;
      fill: #a5b4fc;
    }
    .name {
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 40px;
      font-weight: 700;
      fill: #E0F7FF;
    }
    .role {
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 22px;
      fill: #38bdf8;
    }
    .stack {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      fill: #cbd5f5;
    }
    .chip-text {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      fill: #E5E7EB;
    }
    .label {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      fill: #9CA3AF;
    }
    .value {
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      fill: #E5E7EB;
    }
    .glow-ring {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: ringDraw 4s ease-out forwards, ringPulse 4s ease-in-out infinite 4s;
      opacity: 0.9;
    }
    .fade-up-fast {
      opacity: 0;
      animation: fadeUpFast 0.8s ease-out forwards;
    }
    .fade-up {
      opacity: 0;
      animation: fadeUp 1s ease-out forwards;
    }
    .fade-up-delay {
      opacity: 0;
      animation: fadeUp 1s ease-out forwards;
      animation-delay: 0.4s;
    }
    .fade-up-delay-2 {
      opacity: 0;
      animation: fadeUp 1s ease-out forwards;
      animation-delay: 0.8s;
    }

    @keyframes fadeUpFast {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ringDraw {
      from { stroke-dashoffset: 260; opacity: 0; }
      to   { stroke-dashoffset: 0; opacity: 0.9; }
    }
    @keyframes ringPulse {
      0%   { stroke-width: 2; opacity: 0.9; }
      50%  { stroke-width: 4; opacity: 0.5; }
      100% { stroke-width: 2; opacity: 0.9; }
    }
  </style>

  <!-- Animated background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- Card -->
  <rect x="70" y="40" width="1060" height="240" class="card"/>

  <!-- Decorative glow ring on the right -->
  <ellipse cx="980" cy="160" rx="80" ry="80" class="glow-ring"/>

  <!-- Left content -->
  <!-- Hello -->
  <text x="120" y="105" class="hello fade-up-fast">
    Hello, I'm
  </text>

  <!-- Name -->
  <text x="120" y="150" class="name fade-up">
    Hasan Mahmud
  </text>

  <!-- Role -->
  <text x="120" y="185" class="role fade-up-delay">
    MERN Stack Developer
  </text>

  <!-- Stack line -->
  <text x="120" y="215" class="stack fade-up-delay-2">
    HTML · CSS · JavaScript · React · Node.js · Express · MongoDB
  </text>

  <!-- Chips row -->
  <g class="fade-up-delay-2">
    <rect x="120" y="230" width="170" height="30" rx="16" ry="16"
          fill="rgba(15,23,42,0.90)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="205" y="249" class="chip-text" text-anchor="middle">
      Frontend &amp; Backend
    </text>

    <rect x="310" y="230" width="210" height="30" rx="16" ry="16"
          fill="rgba(15,23,42,0.90)" stroke="#7C4DFF" stroke-width="1.2"/>
    <text x="415" y="249" class="chip-text" text-anchor="middle">
      JavaScript · REST APIs
    </text>

    <rect x="540" y="230" width="210" height="30" rx="16" ry="16"
          fill="rgba(15,23,42,0.90)" stroke="#22c55e" stroke-width="1.2"/>
    <text x="645" y="249" class="chip-text" text-anchor="middle">
      Open to Collaboration
    </text>
  </g>

  <!-- Right side text info (instead of photo) -->
  <g class="fade-up-delay-2">
    <text x="880" y="135" class="label">Location</text>
    <text x="880" y="153" class="value">Dhaka, Bangladesh</text>

    <text x="880" y="185" class="label">Email</text>
    <text x="880" y="203" class="value">hasanmahmudwork21@gmail.com</text>
  </g>
</svg>
